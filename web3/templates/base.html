<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <title>{{ title or "трекер привычек" }}</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">трекер привычек</a>
            <div class="navbar-nav">
                {% if current_user.is_authenticated %}
                    <a class="nav-link" href="/habits">мои привычки</a>
                    <a class="nav-link" href="/habits/add">добавить</a>
                    <a class="nav-link" href="/habits/import">импорт .db</a>
                    <a class="nav-link" href="/logout">выйти ({{ current_user.username }})</a>
                {% else %}
                    <a class="nav-link" href="/login">войти</a>
                    <a class="nav-link" href="/register">регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main role="main" class="container mt-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
