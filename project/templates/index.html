{% extends "base.html" %}

{% block content %}
<div class="text-center mt-5">
    <h1>трекер привычек</h1>
    <p class="lead">отслеживайте свои ежедневные привычки</p>
    {% if not current_user.is_authenticated %}
    <a href="/register" class="btn btn-primary btn-lg">начать</a>
    <a href="/login" class="btn btn-outline-secondary btn-lg">войти</a>
    {% else %}
    <a href="/habits" class="btn btn-primary btn-lg">мои привычки</a>
    {% endif %}
</div>
{% endblock %}
